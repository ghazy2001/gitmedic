<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="medicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Git Branching Paths -->
  <path d="M 170 360 L 170 170 C 170 140, 256 120, 256 160 L 256 360" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />
  <path d="M 256 240 C 256 200, 342 200, 342 240 L 342 360" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round" />

  <!-- Medical Cross with Gradient & Glow -->
  <g filter="url(#glow)">
    <!-- Vertical Cross Bar -->
    <rect x="232" y="140" width="48" height="180" rx="16" fill="url(#medicGrad)" />
    <!-- Horizontal Cross Bar -->
    <rect x="166" y="206" width="180" height="48" rx="16" fill="url(#medicGrad)" />
  </g>

  <!-- Stethoscope / ECG Pulse line in center -->
  <path d="M 150 230 L 210 230 L 235 185 L 256 275 L 277 210 L 302 230 L 362 230" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Git Nodes (Commits) -->
  <circle cx="170" cy="360" r="18" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="5" />
  <circle cx="256" cy="360" r="22" fill="url(#medicGrad)" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="342" cy="360" r="18" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="5" />

  <!-- Top Git Node -->
  <circle cx="256" cy="110" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4" />
</svg>
